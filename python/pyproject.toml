[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datalib"
version = "1.9.0"
description = "Access the IHSN-organized survey microdata archive (get / put / check)."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Joao Pedro Azevedo", email = "jpazevedo@unicef.org" },
    { name = "Minh Cong Nguyen" },
]
license = { text = "MIT" }
dependencies = ["pandas", "pyreadstat", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["datalib*"]
