# =============================================================================
# datalib country registry
# -----------------------------------------------------------------------------
# Authoritative list of ISO 3166-1 alpha-3 codes recognised by datalib, with
# region/income-level metadata used by `_dtlb_ctrycheck` and the catalog frame.
#
# Schema:
#   <ISO3>:
#     name:          full English name
#     iso2:          two-letter ISO code (optional)
#     iso_numeric:   numeric ISO code (optional)
#     region:        World Bank region (EAP, ECA, LAC, MNA, NAR, SAR, SSA, WLD)
#     subregion:     human-readable subregion (free-text)
#     income_level:  WB classification (LIC, LMC, UMC, HIC, NCL = not classified)
#     unicef_region: UNICEF region (LACRO, ECARO, MENARO, EAPRO, ESARO, WCARO, ROSA)
#
# Add a new country: append an entry following ISO 3166-1 alphabetic order.
# Sources: World Bank country metadata API, UNICEF regional groupings.
# =============================================================================

